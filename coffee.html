<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coffee - Café & Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://wa.me">

<style>
:root{
  --bg:#faf7f3;
  --text:#2a2a2a;
  --accent:#8b4a3c;
}

/* SAFE RESET */
*, *::before, *::after{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
}

/* HEADER */
header{
  background:#fff;
  padding:16px 40px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:100;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1200px;
  margin:auto;
}

nav a{
  text-decoration:none;
  color:var(--text);
  font-size:14px;
  font-weight:500;
  padding:8px 12px;
}

.menu-toggle{
  display:none;
  background:none;
  border:none;
  font-size:24px;
  cursor:pointer;
}

#nav-menu{
  display:flex;
  gap:10px;
}

/* CONTENT */
section{
  max-width:900px;
  margin:auto;
  padding:80px 30px;
}

h1{
  font-size:42px;
  margin-bottom:10px;
  line-height:1.2;
}

.subtitle{
  opacity:.75;
  margin-bottom:30px;
  font-size:18px;
}

.divider{
  width:60px;
  height:3px;
  background:var(--accent);
  margin:18px 0 40px;
}

.header-image{
  width:100%;
  height:auto;        /* DESKTOP NATURAL */
  border-radius:12px;
  margin-bottom:40px;
}

.section-title{
  font-size:24px;
  color:var(--accent);
  margin:40px 0 24px;
  font-weight:600;
}

/* MENU */
.menu-item{
  display:flex;
  justify-content:space-between;
  border-bottom:1px dashed #ddd;
  padding:24px 0;
}

.item-name{
  font-weight:600;
  font-size:20px;
  margin-bottom:6px;
}

.item-desc{
  font-size:15px;
  opacity:.8;
  margin-bottom:12px;
  line-height:1.5;
}

.price{
  font-weight:700;
  color:var(--accent);
  font-size:24px;
}

.order{
  display:inline-block;
  color:var(--accent);
  text-decoration:none;
  padding:12px 24px;
  border:2px solid var(--accent);
  border-radius:8px;
  font-weight:600;
  font-size:15px;
  transition:all .25s;
}

.order:hover{
  background:var(--accent);
  color:#fff;
  transform:translateY(-2px);
}

/* IMAGES */
img{
  max-width:100%;
  height:auto;
  border-radius:12px;
}

/* FLOATING WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:24px;
  right:24px;
  background:#25D366;
  color:#fff;
  width:60px;
  height:60px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:600;
  text-decoration:none;
  z-index:999;
  box-shadow:0 8px 32px rgba(37,211,102,0.4);
}

/* MOBILE */
@media (max-width:768px){
  .menu-toggle{display:block;}

  #nav-menu{
    display:none;
    flex-direction:column;
    position:absolute;
    top:100%;
    left:12px;
    right:12px;
    background:#fff;
    padding:24px;
    border-radius:12px;
    box-shadow:0 12px 40px rgba(0,0,0,.2);
    margin-top:8px;
  }

  #nav-menu.active{display:flex;}

  header{padding:12px 16px;}
  section{padding:60px 16px;}
  h1{font-size:32px;}

  /* MOBILE IMAGE CROPPING ONLY */
  .header-image{
    height:220px;
    object-fit:cover;
  }

  .menu-item{
    flex-direction:column;
    text-align:center;
    gap:16px;
  }

  .price{font-size:28px;}
  .order{padding:16px 28px;font-size:17px;}
}

/* EXTRA SMALL */
@media (max-width:360px){
  h1{font-size:28px;}
  section{padding:50px 12px;}
}
</style>
</head>

<body>

<header>
<nav>
<strong style="font-size:20px">Café & Restaurant</strong>
<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div id="nav-menu">
  <a href="index.html">🏠 Home</a>
  <a href="cakes.html">🍰 Cakes</a>
  <a href="coffee.html">☕ Coffee</a>
</div>
</nav>
</header>

<section>
<h1>☕ Coffee Menu</h1>
<p class="subtitle">Freshly brewed daily in Delhi · Hot & cold selections</p>
<div class="divider"></div>

<img src="mum6.png" alt="Fresh coffee" class="header-image" loading="lazy">

<div class="section-title">🔥 Hot Coffee</div>

<!-- KEEP ALL YOUR MENU ITEMS UNCHANGED BELOW -->
<!-- Espresso, Cappuccino, Latte, Cold Coffee, etc. -->

</section>

<a class="whatsapp" href="https://wa.me/919821504642?text=Coffee%20Order!">☕</a>

<script>
function toggleMenu(){
  document.getElementById('nav-menu').classList.toggle('active');
}
document.querySelectorAll('nav a').forEach(link=>{
  link.addEventListener('click',()=>{
    document.getElementById('nav-menu').classList.remove('active');
  });
});
</script>

</body>
</html>
