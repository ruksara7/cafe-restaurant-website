<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coffee & Beverages</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#faf7f3;
  --text:#2a2a2a;
  --accent:#8b4a3c;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:#fff;
  padding:16px 40px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

nav a{
  text-decoration:none;
  margin-left:20px;
  color:var(--text);
  font-size:14px;
}

section{
  max-width:900px;
  margin:auto;
  padding:80px 30px;
}

h1{font-size:36px;margin-bottom:10px}
.subtitle{opacity:.75;margin-bottom:40px}
.divider{width:60px;height:3px;background:var(--accent);margin:18px 0 40px}

.menu-item{
  display:flex;
  justify-content:space-between;
  border-bottom:1px dashed #ddd;
  padding:14px 0;
}

.item-name{font-weight:600}
.item-desc{font-size:13px;opacity:.75;margin-top:4px}
.price{font-weight:600;color:var(--accent)}
.order{font-size:13px;margin-top:6px;display:inline-block;color:var(--accent)}

.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:#fff;
  padding:14px 20px;
  border-radius:40px;
}

/* MOBILE */
@media (max-width:768px){
  header{padding:12px 16px}
  nav{flex-direction:column;gap:8px}
  nav a{margin:0 10px;font-size:15px}
  section{padding:50px 16px}
  h1{font-size:28px}
  .menu-item{flex-direction:column;gap:6px}
}
</style>
</head>

<body>

<header>
<nav>
<strong>Café & Restaurant</strong>
<div>
<a href="index.html">Home</a>
<a href="cakes.html">Cakes</a>
</div>
</nav>
</header>

<section>
<h1>Coffee & Beverages</h1>
<p class="subtitle">Carefully brewed · Hot & Cold</p>
<div class="divider"></div>

<div class="menu-item">
  <div>
    <div class="item-name">Espresso</div>
    <div class="item-desc">Strong single shot</div>
    <a class="order" href="https://wa.me/918076640767">Order on WhatsApp</a>
  </div>
  <div class="price">₹150</div>
</div>

<div class="menu-item">
  <div>
    <div class="item-name">Cappuccino</div>
    <div class="item-desc">Milk & foam</div>
    <a class="order" href="https://wa.me/918076640767">Order on WhatsApp</a>
  </div>
  <div class="price">₹180</div>
</div>
</section>

<a class="whatsapp" href="https://wa.me/918076640767">WhatsApp Order</a>

</body>
</html>
