<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery - Café & Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://wa.me">
<style>
:root{--bg:#faf7f3;--text:#2a2a2a;--accent:#8b4a3c;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;}
header{background:#fff;padding:16px 40px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:100;}
nav{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:auto;}
nav a{text-decoration:none;color:var(--text);font-size:14px;font-weight:500;padding:8px 12px;display:block;}
.menu-toggle{display:none;background:none;border:none;font-size:24px;color:var(--text);cursor:pointer;padding:4px 8px;}
#nav-menu{display:flex;gap:10px;}
section{max-width:900px;margin:auto;padding:80px 30px;}
h1{font-size:42px;margin-bottom:10px;line-height:1.2;}
.subtitle{opacity:.75;margin-bottom:30px;font-size:18px;}
.divider{width:60px;height:3px;background:var(--accent);margin:18px 0 40px;}
.header-image{width:100%;height:280px;object-fit:cover;border-radius:12px;margin-bottom:40px;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin:60px 0;}
.gallery-image{width:100%;height:280px;object-fit:cover;border-radius:12px;}
.whatsapp{position:fixed;bottom:24px;right:24px;background:#25D366;color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:600;z-index:999;box-shadow:0 8px 32px rgba(37,211,102,0.4);}
/* MOBILE */
@media(max-width:768px){
  .menu-toggle{display:block;}
  #nav-menu{display:none;flex-direction:column;position:absolute;top:100%;left:12px;right:12px;background:#fff;padding:24px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.2);margin-top:8px;}
  #nav-menu.active{display:flex;}
  nav a{padding:16px 20px;border-radius:8px;font-size:16px;}
  header{padding:12px 16px;}
  section{padding:60px 16px;}
  h1{font-size:32px;}
  .header-image,.gallery-image{height:220px;}
  .gallery-grid{grid-template-columns:1fr;gap:20px;}
  .whatsapp{bottom:20px;right:20px;width:56px;height:56px;}
}
</style>
</head>
<body>
<header>
<nav>
<strong style="font-size:20px">Café & Restaurant</strong>
<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div id="nav-menu">
<a href="index.html">🏠 Home</a>
<a href="gallery.html">🖼️ Gallery</a>
<a href="cakes.html">🍰 Cakes</a>
<a href="coffee.html">☕ Coffee</a>
</div>
</nav>
</header>
<section>
<h1>🖼️ Gallery</h1>
<p class="subtitle">Our café through your eyes · Fresh moments captured in Delhi</p>
<div class="divider"></div>
<img src="mum2.png" alt="Café exterior" class="header-image">
<div class="gallery-grid">
<img src="mum3.png" alt="Coffee prep" class="gallery-image">
<img src="mum4.png" alt="Team" class="gallery-image">
<img src="mum5.png" alt="Interior" class="gallery-image">
<img src="mum6.png" alt="Pastries" class="gallery-image">
<img src="mum7.png" alt="Drinks" class="gallery-image">
<img src="mum8.png" alt="Dining" class="gallery-image">
</div>
<a class="whatsapp" href="https://wa.me/919821504642?text=Hi!%20Loved%20the%20gallery!">📱</a>
</section>
<script>
function toggleMenu(){document.getElementById('nav-menu').classList.toggle('active');}
document.querySelectorAll('nav a').forEach(link=>link.addEventListener('click',()=>document.getElementById('nav-menu').classList.remove('active')));
</script>
</body>
</html>
