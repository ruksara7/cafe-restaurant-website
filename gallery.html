<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery - Café & Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://wa.me">

<style>
:root{
  --bg:#faf7f3;
  --text:#2a2a2a;
  --accent:#8b4a3c;
}

/* SAFE RESET */
*, *::before, *::after{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
}

/* HEADER */
header{
  background:#fff;
  padding:16px 40px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:100;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1200px;
  margin:auto;
}

nav a{
  text-decoration:none;
  color:var(--text);
  font-size:14px;
  font-weight:500;
  padding:8px 12px;
}

.menu-toggle{
  display:none;
  background:none;
  border:none;
  font-size:24px;
  cursor:pointer;
}

#nav-menu{
  display:flex;
  gap:10px;
}

/* CONTENT */
section{
  max-width:900px;
  margin:auto;
  padding:80px 30px;
}

h1{
  font-size:42px;
  margin-bottom:10px;
  line-height:1.2;
}

.subtitle{
  opacity:.75;
  margin-bottom:30px;
  font-size:18px;
}

.divider{
  width:60px;
  height:3px;
  background:var(--accent);
  margin:18px 0 40px;
}

/* HERO IMAGE */
.header-image{
  width:100%;
  height:auto;            /* DESKTOP NATURAL */
  border-radius:12px;
  margin-bottom:40px;
}

/* GALLERY */
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:24px;
  margin:60px 0;
}

.gallery-item{
  position:relative;
}

.gallery-image{
  width:100%;
  height:auto;            /* DESKTOP NATURAL */
  border-radius:12px;
}

.gallery-caption{
  position:absolute;
  bottom:16px;
  left:16px;
  right:16px;
  background:rgba(0,0,0,.8);
  color:#fff;
  padding:12px 16px;
  border-radius:8px;
  font-size:14px;
  font-weight:500;
  opacity:0;
  transition:opacity .3s;
}

.gallery-item:hover .gallery-caption{
  opacity:1;
}

/* FLOATING WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:24px;
  right:24px;
  background:#25D366;
  color:#fff;
  width:60px;
  height:60px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:600;
  text-decoration:none;
  z-index:999;
  box-shadow:0 8px 32px rgba(37,211,102,.4);
}

/* IMAGES */
img{
  max-width:100%;
  height:auto;
  border-radius:12px;
}

/* MOBILE */
@media (max-width:768px){
  .menu-toggle{display:block;}

  #nav-menu{
    display:none;
    flex-direction:column;
    position:absolute;
    top:100%;
    left:12px;
    right:12px;
    background:#fff;
    padding:24px;
    border-radius:12px;
    box-shadow:0 12px 40px rgba(0,0,0,.2);
    margin-top:8px;
  }

  #nav-menu.active{display:flex;}

  header{padding:12px 16px;}
  section{padding:60px 16px;}
  h1{font-size:36px;}

  /* MOBILE IMAGE CROPPING ONLY */
  .header-image,
  .gallery-image{
    height:220px;
    object-fit:cover;
  }

  .gallery-grid{
    grid-template-columns:1fr;
    gap:20px;
  }

  .whatsapp{
    bottom:20px;
    right:20px;
    width:56px;
    height:56px;
  }
}

/* EXTRA SMALL */
@media (max-width:360px){
  h1{font-size:28px;}
  section{padding:50px 12px;}
}
</style>
</head>

<body>

<header>
<nav>
<strong style="font-size:20px">Café & Restaurant</strong>
<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div id="nav-menu">
  <a href="index.html">🏠 Home</a>
  <a href="gallery.html">🖼️ Gallery</a>
  <a href="cakes.html">🍰 Cakes</a>
  <a href="coffee.html">☕ Coffee</a>
</div>
</nav>
</header>

<section>
<h1>🖼️ Gallery</h1>
<p class="subtitle">Our café through your eyes · Fresh moments captured in Delhi</p>
<div class="divider"></div>

<img src="mum2.png" alt="Café exterior" class="header-image" loading="lazy">

<div class="gallery-grid">
  <div class="gallery-item">
    <img src="mum3.png" alt="Coffee prep" class="gallery-image" loading="lazy">
    <div class="gallery-caption">Coffee crafted with care</div>
  </div>

  <div class="gallery-item">
    <img src="mum4.png" alt="Team" class="gallery-image" loading="lazy">
    <div class="gallery-caption">Our friendly Delhi team</div>
  </div>

  <div class="gallery-item">
    <img src="mum5.png" alt="Interior" class="gallery-image" loading="lazy">
    <div class="gallery-caption">Cozy Delhi atmosphere</div>
  </div>

  <div class="gallery-item">
    <img src="mum6.png" alt="Pastries" class="gallery-image" loading="lazy">
    <div class="gallery-caption">Fresh daily bakes</div>
  </div>

  <div class="gallery-item">
    <img src="mum7.png" alt="Drinks" class="gallery-image" loading="lazy">
    <div class="gallery-caption">Refreshing beverages</div>
  </div>

  <div class="gallery-item">
    <img src="mum8.png" alt="Dining" class="gallery-image" loading="lazy">
    <div class="gallery-caption">Perfect dining setup</div>
  </div>
</div>

<a class="whatsapp" href="https://wa.me/919821504642?text=Hi!%20Loved%20the%20gallery!">📱</a>
</section>

<script>
function toggleMenu(){
  document.getElementById('nav-menu').classList.toggle('active');
}
document.querySelectorAll('nav a').forEach(link=>{
  link.addEventListener('click',()=>{
    document.getElementById('nav-menu').classList.remove('active');
  });
});
</script>

</body>
</html>
