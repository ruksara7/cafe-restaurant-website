<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Café & Restaurant – Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://wa.me">

<style>
:root{
  --bg:#faf7f3;
  --text:#2a2a2a;
  --accent:#8b4a3c;
}

/* RESET */
*, *::before, *::after{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
}

/* HEADER */
header{
  background:#fff;
  padding:16px 40px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:100;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1200px;
  margin:auto;
}

nav a{
  text-decoration:none;
  color:var(--text);
  font-size:14px;
  font-weight:500;
  padding:8px 12px;
}

.menu-toggle{
  display:none;
  background:none;
  border:none;
  font-size:24px;
  cursor:pointer;
}

#nav-menu{
  display:flex;
  gap:10px;
}

/* SECTION */
section{
  max-width:1000px;
  margin:auto;
  padding:80px 30px;
}

h1{
  font-size:40px;
  margin-bottom:10px;
}

.subtitle{
  opacity:.75;
  font-size:18px;
  margin-bottom:30px;
}

.divider{
  width:60px;
  height:3px;
  background:var(--accent);
  margin-bottom:40px;
}

/* HERO IMAGE */
.header-image{
  width:100%;
  border-radius:12px;
  margin-bottom:40px;
}

/* GALLERY */
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:24px;
}

.gallery-item{position:relative;}

.gallery-image{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:12px;
}

.gallery-caption{
  position:absolute;
  bottom:14px;
  left:14px;
  right:14px;
  background:rgba(0,0,0,.8);
  color:#fff;
  padding:10px 14px;
  border-radius:8px;
  font-size:14px;
  opacity:0;
  transition:.3s;
}

.gallery-item:hover .gallery-caption{
  opacity:1;
}

/* WHATSAPP FLOAT */
.whatsapp{
  position:fixed;
  bottom:24px;
  right:24px;
  background:#25D366;
  color:#fff;
  width:60px;
  height:60px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:22px;
  z-index:999;
}

/* MOBILE */
@media(max-width:768px){
  header{padding:12px 16px;}
  section{padding:60px 16px;}
  h1{font-size:30px;}

  .menu-toggle{display:block;}

  #nav-menu{
    display:none;
    flex-direction:column;
    position:absolute;
    top:100%;
    left:12px;
    right:12px;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 12px 40px rgba(0,0,0,.2);
  }

  #nav-menu.active{display:flex;}

  .gallery-image{height:220px;}
}
</style>
</head>

<body>

<header>
<nav>
  <strong style="font-size:20px">Café & Restaurant</strong>
  <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  <div id="nav-menu">
    <a href="index.html">🏠 Home</a>
    <a href="gallery.html">🖼️ Gallery</a>
    <a href="cakes.html">🍰 Cakes</a>
    <a href="coffee.html">☕ Coffee</a>
  </div>
</nav>
</header>

<section>
<h1>🖼️ Gallery</h1>
<p class="subtitle">Fresh moments from our café · Delhi</p>
<div class="divider"></div>

<img src="mum2.png" alt="Cafe exterior" class="header-image" loading="lazy">

<div class="gallery-grid">

  <div class="gallery-item">
    <img src="mum3.png" class="gallery-image" loading="lazy">
    <div class="gallery-caption">Coffee crafted with care</div>
  </div>

  <div class="gallery-item">
    <img src="mum4.png" class="gallery-image" loading="lazy">
    <div class="gallery-caption">Our friendly team</div>
  </div>

  <div class="gallery-item">
    <img src="mum5.png" class="gallery-image" loading="lazy">
    <div class="gallery-caption">Cozy café interior</div>
  </div>

  <div class="gallery-item">
    <img src="mum6.png" class="gallery-image" loading="lazy">
    <div class="gallery-caption">Fresh daily bakes</div>
  </div>

  <div class="gallery-item">
    <img src="mum7.png" class="gallery-image" loading="lazy">
    <div class="gallery-caption">Refreshing beverages</div>
  </div>

  <div class="gallery-item">
    <img src="mum8.png" class="gallery-image" loading="lazy">
    <div class="gallery-caption">Perfect dining setup</div>
  </div>

</div>
</section>

<a class="whatsapp" href="https://wa.me/919821504642">📱</a>

<script>
function toggleMenu(){
  document.getElementById('nav-menu').classList.toggle('active');
}
document.querySelectorAll('#nav-menu a').forEach(link=>{
  link.onclick=()=>document.getElementById('nav-menu').classList.remove('active');
});
</script>

</body>
</html>
